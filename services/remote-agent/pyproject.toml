[project]
name = "celius-agent"
version = "0.3.1"
description = "Celius on this device: sign in, chat here, and let Celius work on it"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
]

[project.optional-dependencies]
# Faster, more complete resource figures (CPU, memory) than the built-in fallbacks.
monitor = ["psutil>=5.9"]

[project.scripts]
celius = "celius_agent.cli:main"
celius-agent = "celius_agent.cli:main"  # earlier name

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["UP041"]  # asyncio.TimeoutError is distinct from TimeoutError on Python 3.10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110", "ASYNC230", "ASYNC240", "ASYNC109"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celius_agent"]
