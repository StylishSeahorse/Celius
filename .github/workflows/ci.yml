name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: celius
          POSTGRES_PASSWORD: celius
          POSTGRES_DB: celius
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U celius" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests on SQLite
        run: uv run pytest -q
      - name: Tests on PostgreSQL + migration round-trip
        run: |
          PGPASSWORD=celius psql -h localhost -U celius -c "create database celius_test"
          uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://celius:celius@localhost:5432/celius
          TEST_DATABASE_URL: postgresql+asyncpg://celius:celius@localhost:5432/celius_test

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: bubblewrap (its tests skip if the runner forbids user namespaces)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: (cd services/api && uv sync --frozen) && pnpm check:api
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: celius
          POSTGRES_PASSWORD: celius
          POSTGRES_DB: celius
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U celius" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://celius:celius@localhost:5432/celius
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cd services/api && uv sync --frozen && uv run alembic upgrade head
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: infra/scripts/e2e-stack.sh
      - run: cd apps/web && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/test-results
            .e2e/*.log

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          echo "SANDBOX_TOKEN=ci-sandbox-token-0123456789" >> .env
          echo "SANDBOX_EGRESS_TOKEN=ci-egress-token-0123456789" >> .env
          docker compose -f infra/compose.yaml --env-file .env config -q
          docker compose -f infra/compose.dev.yaml config -q
          rm .env
      - name: Build image (API + worker + web)
        run: docker build -f infra/docker/Dockerfile.api -t celius-api:ci .
      - name: Build the sandbox image
        run: docker build -f infra/docker/Dockerfile.sandbox -t celius-sandbox:ci .
      - name: The sandbox image runs code and has no network
        run: |
          # As in compose: read-only root, writable workspaces (a volume there, tmpfs here).
          docker run -d --name sb --network none --read-only --tmpfs /tmp \
            --tmpfs /workspaces:uid=10001,gid=10001,mode=0755 --cap-drop ALL \
            --security-opt no-new-privileges -e SANDBOX_TOKEN=ci-sandbox-token-0123456789 \
            celius-sandbox:ci
          for i in $(seq 1 30); do docker exec sb /srv/sandbox/.venv/bin/python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/v1/health')" && break; sleep 1; done
          trap 'docker logs sb' ERR
          docker exec sb /srv/sandbox/.venv/bin/python -c "
          import json, urllib.request
          body = json.dumps({'workspace': 'ci', 'kind': 'python', 'code': 'import pandas, docx, openpyxl, pptx, fpdf, matplotlib, cv2, moviepy, sklearn; import subprocess; subprocess.run([\"ffmpeg\", \"-version\"], check=True, capture_output=True); print(6*7)'}).encode()
          req = urllib.request.Request('http://127.0.0.1:8100/v1/executions', body, {'Authorization': 'Bearer ci-sandbox-token-0123456789', 'Content-Type': 'application/json'})
          result = json.load(urllib.request.urlopen(req))
          print(result)
          assert result['stdout'] == '42\\n', result
          "
          docker rm -f sb
      - name: Clean deployment, backup, disaster, restore, drill, rollback (release gate)
        env:
          CELIUS_API_IMAGE: celius-api:ci
          CELIUS_SANDBOX_IMAGE: celius-sandbox:ci
        run: infra/scripts/test-clean-deployment.sh

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build Windows installers (NSIS + MSI)
        run: pnpm --filter @celius/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: celius-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
