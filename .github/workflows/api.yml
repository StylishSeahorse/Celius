name: api

on:
  push:
    paths: ["services/api/**", "infra/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["services/api/**", "infra/**", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: celius
          POSTGRES_PASSWORD: celius
          POSTGRES_DB: celius
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U celius" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://celius:celius@localhost:5432/celius
      - name: Validate compose files
        working-directory: .
        run: |
          cp .env.example .env
          docker compose -f infra/compose.yaml --env-file .env config -q
          docker compose -f infra/compose.dev.yaml config -q
      - name: Build API image
        working-directory: .
        run: docker build -f infra/docker/Dockerfile.api -t celius-api:ci .
