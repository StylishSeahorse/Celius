name: dependency audit

# Known vulnerabilities in what we ship: the API's and sandbox service's locked
# dependencies, the libraries installed in the sandbox image, and the web app's
# production packages. Weekly (new advisories appear without any change here), and
# whenever a dependency file changes.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "services/api/uv.lock"
      - "services/sandbox/uv.lock"
      - "services/sandbox/runtime-requirements.txt"
      - "pnpm-lock.yaml"
      - ".github/workflows/audit.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, sandbox, sandbox-runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Audit
        run: |
          case "${{ matrix.target }}" in
            sandbox-runtime)
              uvx pip-audit --progress-spinner off --disable-pip --no-deps \
                -r services/sandbox/runtime-requirements.txt ;;
            *)
              cd "services/${{ matrix.target }}"
              uv export --frozen --no-dev --no-hashes --no-emit-project -q > "$RUNNER_TEMP/requirements.txt"
              uvx pip-audit --progress-spinner off -r "$RUNNER_TEMP/requirements.txt" ;;
          esac

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production packages (high and critical)
        run: pnpm audit --prod --audit-level high
