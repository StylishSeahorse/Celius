# Development dependencies only. Run the API on the host with hot reload:
#
#   docker compose -f infra/compose.dev.yaml up -d
#   make migrate && make dev-api
#
name: celius-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: celius
      POSTGRES_PASSWORD: celius
      POSTGRES_DB: celius
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dev-postgres:/var/lib/postgresql/data]

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]

volumes:
  dev-postgres:
